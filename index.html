<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LGU+ 홈 결합 견적서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f4f4f7; padding-bottom: 80px; }
        .text-uplus { color: #E6007E; }
        .bg-uplus { background-color: #E6007E; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        select { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.2em 1.2em; padding-right: 1.8rem; }
        .mobile-container { max-width: 430px; margin: 0 auto; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>

<body class="p-2">

    <div id="capture-area" class="mobile-container overflow-hidden border border-slate-200">
        <div class="bg-uplus p-3 text-white flex justify-between items-center">
            <div>
                <h1 class="text-base font-black tracking-tight uppercase leading-tight">LG Uplus</h1>
                <p class="text-[8px] opacity-90 uppercase tracking-widest leading-none mt-0.5">U+ Bundle Estimate</p>
            </div>
            <div class="text-right">
                <div class="bg-black/15 px-2 py-0.5 rounded-md text-[10px] font-bold" id="displayDate"></div>
            </div>
        </div>

        <div class="p-3">
            <!-- 옵션 설정 -->
            <div class="mb-3 p-3 bg-slate-50 rounded-lg border border-slate-100 no-print flex flex-col gap-2">
                <div class="border-b border-slate-200 pb-1 mb-0.5 flex justify-between items-center">
                    <h2 class="text-[12px] font-bold text-slate-800 tracking-tight">서비스 옵션 설정</h2>
                    <select id="serviceCategory" class="bg-uplus text-white text-[10px] font-bold px-2 py-0.5 rounded outline-none border-none">
                        <option value="home" selected>가정용 인터넷</option>
                        <option value="business">소호 인터넷</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <div id="internetWrapper" class="col-span-2">
                        <label class="block text-[9px] font-bold text-slate-400 mb-0.5 uppercase">인터넷 상품</label>
                        <select id="internet" class="w-full bg-white border border-slate-200 rounded px-1.5 py-1 text-[11px] font-bold text-uplus outline-none">
                        </select>
                        <!-- 인터넷 상품 설명용 동적 가이드 박스 -->
                        <div id="internetDesc" class="mt-1.5 text-[9.5px] leading-relaxed text-slate-600 bg-pink-50/40 border border-pink-100/50 p-2.5 rounded-md hidden"></div>
                    </div>
                </div>

                <div>
                    <label class="block text-[9px] font-bold text-slate-400 mb-0.5 uppercase">메인 TV 요금제</label>
                    <select id="tvPlan" class="w-full bg-white border border-slate-200 rounded px-1.5 py-1 text-[11px] font-bold outline-none">
                    </select>
                </div>

                <div>
                    <label class="block text-[9px] font-bold text-slate-400 mb-0.5 uppercase">부셋탑(추가 TV) 요금제 <span class="text-uplus">(50% 할인)</span></label>
                    <select id="subTvPlan" class="w-full bg-white border border-slate-200 rounded px-1.5 py-1 text-[11px] font-bold outline-none border-uplus ring-1 ring-uplus/20">
                        <option value="none">부셋탑 미선택</option>
                    </select>
                </div>

                <!-- 인터넷 전화 선택형 섹션 (부셋탑 요금제 바로 밑에 배치 / 소호 인터넷 시에만 노출) -->
                <div id="phoneSection" class="flex flex-col gap-1.5 border-t border-slate-200 pt-2 mt-1 hidden">
                    <label class="block text-[9px] font-bold text-slate-400 uppercase tracking-tight">인터넷 전화 선택형 (3년 약정 기준)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <select id="phonePlan" class="w-full bg-white border border-slate-200 rounded px-1.5 py-1 text-[11px] font-bold outline-none focus:ring-1 focus:ring-uplus">
                                <option value="none" selected>전화 미선택</option>
                                <option value="normal">일반형 요금제 (1,100원)</option>
                                <option value="free3">자유통화3 요금제 (5,500원)</option>
                            </select>
                        </div>
                        <div>
                            <select id="phoneDevice" class="w-full bg-white border border-slate-200 rounded px-1.5 py-1 text-[11px] font-bold outline-none focus:ring-1 focus:ring-uplus">
                                <option value="none" selected>단말기 미선택</option>
                                <option value="ip520s">IP520S (1,220원)</option>
                                <option value="cpg">CPG (1,100원)</option>
                                <option value="ip450s">IP450S (610원)</option>
                            </select>
                        </div>
                    </div>

                    <div id="phoneVasContainer" class="flex gap-4 mt-1 pl-1 hidden">
                        <label class="flex items-center gap-1.5 text-[9.5px] font-bold text-slate-600 cursor-pointer">
                            <input type="checkbox" id="phoneVasCallerId" class="w-3.5 h-3.5 accent-uplus"> 발신번호표시 (+1,100원)
                        </label>
                        <label class="flex items-center gap-1.5 text-[9.5px] font-bold text-slate-600 cursor-pointer">
                            <input type="checkbox" id="phoneVasForwarding" class="w-3.5 h-3.5 accent-uplus"> 착신전환 (+550원)
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[9px] font-bold text-slate-400 mb-0.5 uppercase">U+ 스마트홈</label>
                        <select id="smartHome" class="w-full bg-white border border-slate-200 rounded px-1.5 py-1 text-[11px] font-bold outline-none">
                            <option value="none" selected>미선택</option>
                            <option value="family">우리집지킴이 Family (11,000원)</option>
                            <option value="kids">우리집돌봄이 Kids (12,100원)</option>
                            <option value="doorcam">우리집지킴이 도어캠 (14,300원)</option>
                        </select>
                    </div>
                    <div>
                        <!-- 입력 방식 대신 0대~5대까지 고를 수 있는 드롭다운 셀렉트 박스 -->
                        <label class="block text-[9px] font-bold text-slate-400 mb-0.5 uppercase">지능형 CCTV 수량</label>
                        <select id="cctvQty" class="w-full bg-white border border-slate-200 rounded px-1.5 py-1 text-[11px] font-bold outline-none focus:ring-1 focus:ring-uplus">
                            <option value="0" selected>미선택</option>
                            <option value="1">1대</option>
                            <option value="2">2대</option>
                            <option value="3">3대</option>
                            <option value="4">4대</option>
                            <option value="5">5대</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[9px] font-bold text-slate-400 mb-0.5 uppercase">모바일/가족 결합 할인</label>
                    <select id="familyCombination" class="w-full bg-white border border-slate-200 rounded px-1.5 py-1 text-[11px] font-bold outline-none border-pink-200 focus:ring-1 focus:ring-uplus">
                        <option value="none" selected>결합 할인 미선택</option>
                        <option value="together">U+투게더 결합 할인 (-11,000원)</option>
                        <option value="easy99">참쉬운 가족결합 (-9,900원)</option>

                <div id="promoSection" class="flex flex-col gap-1.5 border-t border-slate-200 pt-2">
                    <div class="text-[9.5px] font-bold text-uplus tracking-tight flex items-center gap-1">
                        <span class="w-1 h-2 bg-uplus rounded-full inline-block"></span>
                        [영업 활성화 프로모션]
                    </div>

                    <div class="grid grid-cols-2 gap-x-2 gap-y-1.5 mt-0.5">
                        <label class="flex items-center gap-1.5 text-[9.5px] font-bold text-slate-700 cursor-pointer">
                            <input type="checkbox" id="policyGeneral" class="w-3.5 h-3.5 accent-uplus"> 결제안심무선 (+5만)
                        </label>
                        <label class="flex items-center gap-1.5 text-[9.5px] font-bold text-slate-700 cursor-pointer">
                            <input type="checkbox" id="policyAnsim" class="w-3.5 h-3.5 accent-uplus"> 안심보상신규 (+8만)
                        </label>
                        <label class="flex items-center gap-1.5 text-[9.5px] font-bold text-uplus cursor-pointer col-span-2">
                            <input type="checkbox" id="goodStart" class="w-3.5 h-3.5 accent-uplus"> Good Start (+5만)
                        </label>
                    </div>
                </div>
            </div>

            <div class="mb-1.5 px-1 flex justify-between items-end">
                <h3 class="text-[13px] font-bold text-slate-800">■ 월 청구 예상 요금</h3>
                <span class="text-[8px] text-slate-400">결합 할인 자동 계산 / 부가세(VAT) 포함</span>

                    </thead>
                    <tbody id="priceTable" class="divide-y divide-slate-200"></tbody>
                </table>
            </div>

            <!-- 사은품 및 합계 -->
            <div class="flex flex-col gap-3">
                <div>
                    <h3 class="text-[13px] font-bold text-slate-900 mb-1 px-1">■ 사은품 및 특별 지원금</h3>
                    <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 text-[10px]">
                        <div id="voucherList" class="flex flex-col gap-1 mb-2 border-b border-slate-200 pb-2"></div>
                        <div class="flex flex-col">
                            <span class="text-[9px] font-bold text-slate-800 uppercase tracking-tighter">LG U+ 특별 지원금 (현금성 상품권)</span>
                            <div class="flex items-baseline justify-between">
                                <div class="flex items-baseline gap-0.5 text-red-600"><span id="voucherTotal" class="text-2xl font-black tracking-tight">0</span><span class="text-xs font-bold">원</span></div>
                                <span class="text-[8px] text-slate-500 font-medium">신세계/홈플러스 지급</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-slate-800 p-4 rounded-xl text-white shadow-xl relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 w-16 h-16 bg-uplus/20 rounded-full"></div>
                    <div class="flex justify-between items-center text-[11px] mb-1">
                        <span class="text-slate-400">공급 가액 (부가세 제외)</span>
                        <span id="subtotal" class="font-bold text-slate-300">0</span>
                    </div>
                    <div class="flex justify-between items-center text-[11px] border-b border-white/10 pb-2 mb-2">
                        <span class="text-slate-400">부가가치세 (10%)</span>
                        <span id="vatTotal" class="font-bold text-slate-300">0</span>
                    </div>
                    <div class="flex justify-between items-end">
                        <span class="text-[13.5px] font-black text-pink-200 uppercase tracking-tight">최종 청구 금액 (VAT 포함)</span>

                    </div>
                </div>
            </div>
        </div>

        <div class="bg-slate-100 p-4 text-center text-[8px] text-slate-400 border-t border-slate-200">
            <p>© LG Uplus Corp. All rights reserved.</p>
        </div>
    </div>

    <div class="max-w-[430px] mx-auto mt-6 px-2 no-print pb-10">

            // ReferenceError 원인이었던 초기화 전 finalTotal 조회를 임시 변수 구조로 완벽하게 수정
            const calculatedTotal = runningTotal - totalDiscount;
            const finalTotal = calculatedTotal < 0 ? 0 : calculatedTotal;
            const supplyPrice = Math.round(finalTotal / 1.1);
            const vat = finalTotal - supplyPrice;

            document.getElementById('subtotal').innerText = supplyPrice.toLocaleString() + ' 원';
            document.getElementById('vatTotal').innerText = vat.toLocaleString() + ' 원';
            document.getElementById('total').innerText = finalTotal.toLocaleString();

            const vList = document.getElementById('voucherList');
            vList.innerHTML = '';
            let vTotal = 0;

            const isCombined = isTvSelected || subTvKey !== 'none' || cctvQty > 0 || smartHomeKey !== 'none' || familyComboKey !== 'none' || (cat === 'business' && phonePlanVal !== 'none');

            let baseV = 0;
            let baseVLabel = "기본 혜택";

            if (cat === 'home') {
                if (isCombined) {
                    baseV = internetInfo.voucher || 0;
                    baseVLabel = `가정용 결합 기본 혜택`;
                } else {
                    baseV = 150000;
                    baseVLabel = "인터넷 단독 혜택";
                }
                vTotal += baseV;
                vList.innerHTML += `<div class="flex justify-between"><span>${baseVLabel}</span><span class="font-bold">${baseV.toLocaleString()} 원</span></div>`;
                
                if (smartHomeKey !== 'none') {
                    vTotal += 70000;
                    vList.innerHTML += `<div class="flex justify-between text-pink-600 font-bold"><span>스마트홈 결합 사은품 추가</span><span class="font-bold">+ 70,000 원</span></div>`;
                }

                if (subTvKey !== 'none') { 
                    vTotal += 30000; 
                    vList.innerHTML += `<div class="flex justify-between"><span>부셋탑 추가 혜택</span><span class="font-bold">30,000 원</span></div>`; 
                }
            } else {
                baseV = internetInfo.voucher || 0;
                baseVLabel = isCombined ? "소호 결합 기본 혜택" : "소호 인터넷 기본 혜택";
                vTotal += baseV;
                vList.innerHTML += `<div class="flex justify-between"><span>${baseVLabel} (${intKey})</span><span class="font-bold">${baseV.toLocaleString()} 원</span></div>`;

                if (isTvSelected) {
                    vTotal += 150000;
                    vList.innerHTML += `<div class="flex justify-between text-pink-600 font-bold"><span>TV 결합 사은품 추가</span><span class="font-bold">+ 150,000 원</span></div>`;
                }

                if (cctvQty > 0) {
                    const cctvVoucher = cctvQty * 40000;
                    vTotal += cctvVoucher;
                    vList.innerHTML += `<div class="flex justify-between text-blue-600 font-bold"><span>CCTV 결합 사은품 추가 (${cctvQty}대)</span><span class="font-bold">+ ${cctvVoucher.toLocaleString()} 원</span></div>`;
                }

                // 이전 AI 전화 사은품을 '인터넷 전화 결합 사은품'으로 명칭을 전환하여 소호에서 전화 선택 시 5만 원 추가 사은품 연동
                if (phonePlanVal !== 'none') {
                    vTotal += 50000;
                    vList.innerHTML += `<div class="flex justify-between text-teal-600 font-bold"><span>인터넷 전화 결합 사은품 추가</span><span class="font-bold">+ 50,000 원</span></div>`;
                }

                if (subTvKey !== 'none') { 
                    vTotal += 30000; 
                    vList.innerHTML += `<div class="flex justify-between"><span>부셋탑 추가 혜택</span><span class="font-bold">30,000 원</span></div>`; 
                }
            }

            if (hasPolicyGeneral && !intKey.includes('100M')) {
                vTotal += 50000;
                vList.innerHTML += `<div class="flex justify-between text-slate-700"><span>일반결제안심무선 지원</span><span class="font-bold">+ 50,000 원</span></div>`;
            }
            if (hasPolicyAnsim && !intKey.includes('100M')) {
                vTotal += 80000;
                vList.innerHTML += `<div class="flex justify-between text-slate-700"><span>안심보상(신규요금제) 지원</span><span class="font-bold">+ 80,000 원</span></div>`;
            }
            if (hasGoodStart && !intKey.includes('100M')) {
                vTotal += 50000;
                vList.innerHTML += `<div class="flex justify-between text-uplus font-bold"><span>Good Start 프로모션</span><span class="font-bold">+ 50,000 원</span></div>`;
            }
            document.getElementById('voucherTotal').innerText = vTotal.toLocaleString();
        }

        async function captureAndSave(btn) {
            const area = document.getElementById('capture-area');
            const originalHTML = btn.innerHTML;
            
            try {
                btn.innerHTML = '처리 중...';
                const canvas = await html2canvas(area, { 
                    scale: 4, 
                    useCORS: true, 
                    backgroundColor: '#ffffff',
                    windowWidth: area.scrollWidth,
                    windowHeight: area.scrollHeight
                });
                const link = document.createElement('a');
                link.download = `LGU_Estimate_${new Date().getTime()}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            } finally { 
                btn.innerHTML = originalHTML; 
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initSelects();
            document.getElementById('serviceCategory').addEventListener('change', () => { 
                updateTvList(); 
                updateInternetList(); 
                update(); 
            });
            document.querySelectorAll('select, input').forEach(el => el.addEventListener('change', update));
            
            // 초기 로드 시 'home' 기준으로 폼 강제 동기화
            document.getElementById('serviceCategory').value = "home";
            updateTvList();
            updateInternetList();
            update();
        });
    </script>
</body>
</html>
